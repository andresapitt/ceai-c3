<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" width="420" height="110" role="img" aria-label="Logo Promover Asociación Civil (Placeholder)">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B6A45"/>
      <stop offset="100%" stop-color="#0E442B"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E89B24"/>
      <stop offset="100%" stop-color="#D47313"/>
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(15, 12)">
    <!-- Outer shield / rounded container -->
    <rect x="0" y="0" width="86" height="86" rx="22" fill="url(#pGrad)"/>
    <!-- Community / Growth Symbol -->
    <circle cx="43" cy="30" r="11" fill="url(#sunGrad)"/>
    <!-- Interlocking growth curves -->
    <path d="M26 68 C26 52, 38 48, 43 48 C48 48, 60 52, 60 68 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M34 68 C34 58, 40 55, 43 55 C46 55, 52 58, 52 68 Z" fill="url(#pGrad)"/>
    <circle cx="27" cy="46" r="6.5" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="59" cy="46" r="6.5" fill="#FFFFFF" opacity="0.85"/>
    <path d="M19 72 C19 62, 26 58, 29 58 C32 58, 36 60, 36 72 Z" fill="#FFFFFF" opacity="0.6"/>
    <path d="M50 72 C50 60, 54 58, 57 58 C60 58, 67 62, 67 72 Z" fill="#FFFFFF" opacity="0.6"/>
  </g>

  <!-- Text Group -->
  <g transform="translate(120, 30)">
    <!-- Brand Name -->
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="#141414" letter-spacing="-0.02em">promover</text>
    <text x="175" y="16" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#1B6A45" letter-spacing="0.08em">[LOGO PROVISORIO]</text>
    <!-- Subtitle -->
    <text x="2" y="55" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="15.5" font-weight="700" fill="#1B6A45" letter-spacing="0.03em">ASOCIACIÓN CIVIL</text>
    <text x="2" y="73" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#5A5855" letter-spacing="0.01em">Promoción Humana y Desarrollo Social • Res. 031/A/01</text>
  </g>
</svg>
